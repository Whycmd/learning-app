name: 功能建议
description: 提出新功能或对现有功能改进的建议
title: "[建议] "
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进本项目。请尽量描述清楚「你遇到什么场景、希望变成什么样」，不需要写实现方案。

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么的时候觉得不方便？越具体越好。
      placeholder: 例如：批量导入 50 个生词后，想一次全部固化，但现在是逐个点…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望效果
      description: 你希望功能变成什么样。
      placeholder: 例如：能选中多个词一次性发起固化，并在页面看到进度。
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 你理解的优先级
      options:
        - 高（明显影响主要使用流程）
        - 中（能用但不够顺手）
        - 低（锦上添花）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案或参考产品
      description: 你现在是怎么绕过这个问题的？有没有同类产品的做法可以参考？（可选）
    validations:
      required: false

  - type: input
    id: contact
    attributes:
      label: 联系方式
      description: 如需进一步沟通，可留下邮箱或 GitHub 用户名。（可选）
    validations:
      required: false
