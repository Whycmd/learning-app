# ============================================================
# 一键启动：数据库 + 应用
#
# 用法（三行）：
#   1. cp .env.example .env      ← 填数据库密码，AI Key 可选
#   2. docker compose up         ← 首次约 3-5 分钟（编译 + 建表），之后几十秒
#   3. 浏览器打开 http://127.0.0.1:8088
#
# 里面有两个容器：
#   db   —— MySQL 8.0。数据存在命名卷 mysql_data 里，删容器不会丢数据。
#   app  —— C++ 后端 + Node AI 网关。通过内部网络用 "db" 这个名字连数据库。
#
# 安全边界（重要）：
#   只有 8088 端口映射到宿主机的 127.0.0.1；
#   MySQL 的 3306 完全不向宿主机开放，外部扫不到。
# ============================================================

# 项目名必须显式写：本仓库目录名包含中文，
# Compose 无法从目录名自动推导项目名，会报"project name must not be empty"。
name: english-learning-app

services:
  # ---------- 数据库 ----------
  db:
    # 默认用国内加速器地址，因为 Docker Hub 官方仓库国内经常连不上。
    # 如果你的网络能直连，把 .env 里的 MYSQL_IMAGE 改成 mysql:8.0 即可。
    image: ${MYSQL_IMAGE:-docker.m.daocloud.io/library/mysql:8.0}
    container_name: elf-db
    restart: unless-stopped
    environment:
      # root 密码只用于数据库内部的健康检查；应用实际用的是下面的 eng_app 账号
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-elf_root_local}
      # 允许 root 从其他容器（app）连接。
      # MySQL 官方镜像默认把 root 限制为 localhost，容器间走 TCP 时会被拒绝。
      # 只在"数据卷为空、首次初始化"时生效；已有数据卷需手动补授权。
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-english_learning}
      MYSQL_USER: ${MYSQL_USER:-eng_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elf_app_local}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # 数据持久化：容器删了重建，学习记录、知识点都还在
      - mysql_data:/var/lib/mysql
      # 首次启动（数据卷为空时）自动执行这里的 8 个 SQL，建库建表
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    command:
      # 字符集：全库 utf8mb4，中文释义和 emoji 都能存
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 和 macOS 本机行为保持一致（本机默认不区分表名大小写），
      # 避免代码里表名大小写不一致时，在 Linux 上突然报表不存在。
      # 注意：这个参数只能在"数据卷为空"的首次初始化时生效。
      - --lower-case-table-names=2
      # MySQL 8 默认用 caching_sha2_password，部分旧版客户端库不支持。
      # 这里统一改成旧认证方式，保证各平台都能连上。
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      # 用 mysqladmin ping 判断"数据库真的能接请求了"，而不只是进程存在
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-elf_root_local}"]
      interval: 5s
      timeout: 5s
      retries: 20
      # 首次启动要执行 8 个建表脚本，给 60 秒宽限期，避免误判为不健康
      start_period: 60s
    networks:
      - elf

  # ---------- 应用 ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建用的基础镜像（Node 20）。和 MYSQL_IMAGE 一样，
        # 默认走国内加速器；能直连 Docker Hub 时可改成 node:20-slim
        BASE_IMAGE: ${BASE_IMAGE:-docker.m.daocloud.io/library/node:20-slim}
    container_name: elf-app
    restart: unless-stopped
    depends_on:
      db:
        # 等数据库"健康"了再启动，而不是"进程起来了"就启动
        condition: service_healthy
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-english_learning}
      MYSQL_USER: ${MYSQL_USER:-eng_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-elf_app_local}
      # 测试套件需要 root 权限（会建/删测试用户、改表状态），
      # 下面三项只用于容器内跑 node tests/run_all.js
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-elf_root_local}
      DB_HOST: db
      DB_PORT: "3306"
      # 测试代码调用 mysql 时带 --socket 参数，容器之间没有共享 socket，
      # 用这个包装脚本把 socket 参数改写成 TCP 连接（见 tests/_mysql_tcp_shim.sh）
      MYSQL_BIN: /app/tests/_mysql_tcp_shim.sh
      MYSQL_PW_FILE: /tmp/.mysql_root_pw
      # scripts/check_consistency.js 读取密码用的是另一个变量名，指向同一份文件
      DB_PASSWORD_FILE: /tmp/.mysql_root_pw
      # 智谱 Key：留空也能启动，只是 AI 功能不可用
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      TZ: ${TZ:-Asia/Shanghai}
      LOCALAI_LOG_DIR: /app/logs
      APP_ROOT: /app
    ports:
      # 只绑宿主机 127.0.0.1：本机能访问，局域网里的其他设备访问不到
      - "127.0.0.1:${APP_PORT:-8088}:8088"
    volumes:
      # 导出的 Word 文件落到宿主的 word_tmp/，方便直接用 Word 打开
      - ./word_tmp:/app/word_tmp
    networks:
      - elf

volumes:
  mysql_data:

networks:
  elf:
    driver: bridge
