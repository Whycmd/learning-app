<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识点详情 · 学习圣殿</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/components.css">
<script src="/static/theme.js"></script>
<script src="/static/nav.js"></script>
<script src="/static/marked.min.js"></script>
<script src="/static/md-render.js"></script>
<style>
  /* T010：Markdown 精讲排版，颜色/间距取自 style.css :root 令牌 */
  .md-content { line-height: 1.75; color: var(--ink-soft); font-size: 14px; }
  .md-content h1, .md-content h2, .md-content h3,
  .md-content h4, .md-content h5, .md-content h6 {
    color: var(--ink); font-family: var(--font-display); line-height: 1.4;
    margin: var(--sp-md) 0 var(--sp-xs);
  }
  .md-content h1 { font-size: 20px; }
  .md-content h2 { font-size: 17px; }
  .md-content h3 { font-size: 15px; }
  .md-content h4, .md-content h5, .md-content h6 { font-size: 14px; }
  .md-content p { margin: var(--sp-xs) 0; }
  .md-content ul, .md-content ol { margin: var(--sp-xs) 0; padding-left: 1.6em; }
  .md-content li { margin: 2px 0; }
  .md-content blockquote {
    margin: var(--sp-sm) 0; padding: 2px 0 2px var(--sp-sm);
    border-left: 3px solid var(--gold); color: var(--muted); background: var(--gold-wash);
  }
  .md-content code {
    padding: 1px 5px; border-radius: var(--r-sm);
    background: var(--paper-deep); font-size: 0.92em;
  }
  .md-content pre {
    margin: var(--sp-sm) 0; padding: var(--sp-sm); border-radius: var(--r-sm);
    background: var(--paper-deep); overflow-x: auto;
  }
  .md-content pre code { padding: 0; background: none; }
  .md-content hr { border: none; border-top: 1px dashed var(--line); margin: var(--sp-md) 0; }
  .md-content table { border-collapse: collapse; margin: var(--sp-sm) 0; }
  .md-content th, .md-content td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
  .md-content a { color: var(--accent); text-decoration: underline; }
</style>
</head>
<body>
<div id="topbar-slot"></div>

<!-- T104：知识点详情页 · 套用圣殿设计系统 v2 -->
<div class="page">

  <div class="dougong-bar">
    <svg viewBox="0 0 400 32"><path d="M0 32 L40 18 L60 28 L80 12 L100 24 L120 8 L140 20 L160 4 L180 16 L200 0 L220 16 L240 4 L260 20 L280 8 L300 24 L320 12 L340 28 L360 18 L400 32Z" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/></svg>
  </div>

  <h1 class="section-title">知识点详情</h1>
  <p class="section-sub">选择词条 → 六板块结构化呈现 · AI 朗读</p>

  <!-- 选择器：wing-card 包裹 -->
  <div class="wing-card">
    <div class="wing-card__cap">
      <span class="wing-card__ico">
        <svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M3 4h3v16H3zM18 4h3v16h-3z"/></svg>
      </span>
      <span class="wing-card__title">选择词条</span>
      <span class="wing-card__meta" id="sel-meta">–</span>
    </div>
    <select class="input" id="selector"></select>
    <p class="state-line" id="detail-msg"></p>
  </div>

  <!-- 详情渲染区 -->
  <div id="detail"></div>

</div>

<script src="/static/tts.js"></script>
<script>
(function ()
{
  'use strict';

  const EXTRA_LABEL = {
    phonetic: '音标',
    root: '词根与词源',
    word_family: '同源词汇',
    allusions: '典故、俗语',
    synonym_analysis: '同义词辨析',
    phrase_analysis: '短语额外解析',
    key_points: '重点补充',
    frequency: '使用频率',
    register: '语域说明',
    cultural: '文化延伸',
    related_words: '同类词语'
  };

  // extra 板块渲染顺序（与 AI 固化输出的六板块一致）
  const EXTRA_ORDER = [
    'phonetic', 'root', 'word_family', 'allusions',
    'synonym_analysis', 'phrase_analysis', 'key_points',
    'frequency', 'register', 'cultural', 'related_words'
  ];

  async function initList()
  {
    try
    {
      const r = await fetch('/api/kp?size=1000', { cache: 'no-store' });
      const j = await r.json();
      const kps = j.data || [];
      const sel = document.getElementById('selector');
      sel.innerHTML = kps.map(k =>
        `<option value="${k.id}">${k.standard_content || k.user_input_content}${k.is_solidified ? '' : '（待固化）'}</option>`
      ).join('');
      document.getElementById('sel-meta').textContent = '共 ' + kps.length + ' 条';
      const preset = new URLSearchParams(location.search).get('id');
      const presetHit = preset && kps.some(k => String(k.id) === preset);
      if (presetHit) sel.value = preset;
      if (kps.length) await loadDetail();
      else document.getElementById('detail').innerHTML =
        '<div class="wing-card"><p class="state-line">暂无知识点，请先录入并固化。</p></div>';
      if (preset && !presetHit)
      {
        const msg = document.getElementById('detail-msg');
        msg.className = 'state-line state-line--danger';
        msg.textContent = '词条 #' + preset + ' 不存在或已被合并，已显示最新词条';
      }
    }
    catch (e)
    {
      document.getElementById('sel-meta').textContent = '加载失败';
    }
  }

  async function loadDetail()
  {
    const id = document.getElementById('selector').value;
    if (!id) return;
    const msg = document.getElementById('detail-msg');
    const detail = document.getElementById('detail');
    detail.innerHTML = '<div class="wing-card"><div class="skeleton skeleton--title"></div><div class="skeleton skeleton--text"></div><div class="skeleton skeleton--text"></div></div>';
    msg.className = 'state-line';
    msg.textContent = '';

    let d;
    try
    {
      const r = await fetch('/api/kp/' + id, { cache: 'no-store' });
      d = await r.json();
    }
    catch (e) { d = null; }

    if (!d || d.error)
    {
      detail.innerHTML = '<div class="wing-card"><p class="state-line state-line--danger">加载失败</p></div>';
      return;
    }

    // extras 字典化
    const extras = {};
    for (const e of (d.extras || [])) extras[e.extra_type] = e.content;
    const blocks = [];

    // 标题 + TTS + 核心释义
    const word = d.standard_content || d.user_input_content || '';
    const ttsArg = word.replace(/'/g, "\\'").replace(/"/g, '&quot;');

    // 核心释义与例句
    const defs = (d.definitions || []).map((x, i) =>
      `<div class="entry">
         <div class="entry__main">
           <div class="entry__foreign">${i + 1}. [${escapeHtml(x.pos)}] ${escapeHtml(x.meaning)}</div>
           ${x.example ? `<div class="entry__native">${escapeHtml(x.example)}</div>` : ''}
         </div>
       </div>`).join('');

    blocks.push(`
    <section class="wing-card">
      <div class="wing-card__cap">
        <span class="wing-card__ico">
          <svg viewBox="0 0 24 24"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        </span>
        <span class="kp-title">${escapeHtml(word)}</span>
        <button class="speak-btn u-push-end" type="button" data-tts="${ttsArg}" title="朗读">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><polygon points="11 5 6 9 2 9 2 15 6 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        </button>
      </div>
      <div class="pack__badges">
        ${extras.phonetic ? `<span class="pill">${escapeHtml(extras.phonetic)}</span>` : ''}
        <span class="pill pill--ai">${d.master_require || '未固化'}</span>
        <span class="pill">难度 ${d.difficulty != null ? d.difficulty : '-'}</span>
        ${d.is_solidified === 1 ? '' : '<span class="pill">待固化</span>'}
      </div>
      <div class="kp-sub">核心释义 & 例句</div>
      ${defs || '<p class="state-line">无</p>'}
    </section>`);

    // 固定搭配
    if ((d.collocations || []).length)
    {
      const colHtml = d.collocations.map(c =>
        `<div class="entry">
           <div class="entry__main">
             <div class="entry__foreign">• ${escapeHtml(c.collocation)}</div>
             ${c.example ? `<div class="entry__native">${escapeHtml(c.example)}</div>` : ''}
           </div>
         </div>`).join('');
      blocks.push(`
      <section class="wing-card">
        <div class="wing-card__cap">
          <span class="wing-card__ico"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
          <span class="wing-card__title">固定搭配</span>
          <span class="wing-card__meta">共 ${d.collocations.length} 条</span>
        </div>
        ${colHtml}
      </section>`);
    }

    // 近义 / 反义
    const syns = (d.synonyms || []).map(s => escapeHtml(s.synonym)).join(' / ');
    const ants = (d.antonyms || []).map(s => escapeHtml(s.antonym)).join(' / ');
    if (syns || ants)
    {
      blocks.push(`
      <section class="wing-card">
        <div class="wing-card__cap">
          <span class="wing-card__ico"><svg viewBox="0 0 24 24"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></svg></span>
          <span class="wing-card__title">近义 / 反义</span>
        </div>
        ${syns ? `<p class="kp-synonym"><strong>近义：</strong>${syns}</p>` : ''}
        ${ants ? `<p class="kp-synonym"><strong>反义：</strong>${ants}</p>` : ''}
      </section>`);
    }

    // 讲解类内容：新格式为单条 Markdown；旧格式仍走下方逐条 <br> 渲染
    if (extras.markdown_content)
    {
      const mdHtml = typeof window.renderMarkdown === 'function'
        ? window.renderMarkdown(extras.markdown_content)
        : escapeHtml(extras.markdown_content).replace(/\n/g, '<br>');
      blocks.push(`
      <section class="wing-card">
        <div class="wing-card__cap">
          <span class="wing-card__ico">${extraIcon('markdown_content')}</span>
          <span class="wing-card__title">单词精讲</span>
        </div>
        <div class="md-content">${mdHtml}</div>
      </section>`);
    }

    // 扩展板块（词根/同源/典故等）
    for (const t of EXTRA_ORDER)
    {
      if (!extras[t]) continue;
      const icon = extraIcon(t);
      blocks.push(`
      <section class="wing-card">
        <div class="wing-card__cap">
          <span class="wing-card__ico">${icon}</span>
          <span class="wing-card__title">${EXTRA_LABEL[t] || t}</span>
        </div>
        <div class="kp-extra">${escapeHtml(extras[t]).replace(/\n/g, '<br>')}</div>
      </section>`);
    }

    if (blocks.length === 0)
    {
      blocks.push(`<section class="wing-card"><p class="state-line state-line--danger">该词条尚未 AI 固化，暂无详情内容。请返回录入页点击固化。</p></section>`);
    }

    detail.innerHTML = blocks.join('');

    // TTS 事件绑定（事件委托）
    detail.querySelectorAll('[data-tts]').forEach(btn =>
    {
      btn.addEventListener('click', () => TTS.speak(btn.dataset.tts));
    });
  }

  function escapeHtml(s)
  {
    return String(s || '').replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function extraIcon(type)
  {
    // 不同 extra 类型给不同 SVG 图标（与 wing-card__ico 配合）
    const icons = {
      markdown_content: '<svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>',
      phonetic:     '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>',
      root:         '<svg viewBox="0 0 24 24"><path d="M12 2v20"/><path d="M12 2a5 5 0 0 1 5 5v0a5 5 0 0 1-5 5"/><path d="M12 7a5 5 0 0 0-5 5v0a5 5 0 0 0 5 5"/></svg>',
      word_family:  '<svg viewBox="0 0 24 24"><path d="M17 10H8"/><path d="M17 14H8"/><path d="M21 6H3"/><path d="M21 18H3"/></svg>',
      allusions:    '<svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>',
      synonym_analysis: '<svg viewBox="0 0 24 24"><path d="M9 11l3-3 3 3"/><path d="M9 13l3 3 3-3"/></svg>',
      phrase_analysis:  '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>',
      key_points:    '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
      frequency:     '<svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>',
      register:      '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>',
      cultural:      '<svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>',
      related_words: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>'
    };
    return icons[type] || '<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  }

  document.getElementById('selector').addEventListener('change', loadDetail);
  initList();
})();
</script>
</body>
</html>
