window.DEV_LABELS = {
  status: {
    backlog: { new: "新提交", triage: "待分拣", accepted: "已采纳", planned: "已排期", shipped: "已上线", rejected: "已拒绝" },
    bugs:    { new: "新提交", triage: "待分拣", confirmed: "已确认", fixing: "修复中", fixed: "已修复", closed: "已关闭", duplicate: "重复" }
  },
  priority: { P0: "P0", P1: "P1", P2: "P2" },
  severity: { blocker: "阻断", major: "严重", minor: "轻微" },
  category: {
    backlog: { feature: "新功能", enhancement: "改进" },

  }
};

<div id="topbar-slot"></div>

  <div class="dv-tabs" id="dv-tabs">

  <div class="dv-filter" id="dv-filter"></div>

  <div id="dv-list" class="dv-list"></div>

</div>

<div class="page" id="dv-denied" hidden>

  </section>
