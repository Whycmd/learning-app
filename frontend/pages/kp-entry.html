<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识点录入 · 学习圣殿</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/components.css">
<script src="/static/theme.js"></script>
<script src="/static/nav.js"></script>
</head>
<body>
<div id="topbar-slot"></div>

<!-- T104：知识点录入页 · 套用圣殿设计系统 v2 -->
<div class="page">

  <div class="dougong-bar">
    <svg viewBox="0 0 400 32"><path d="M0 32 L40 18 L60 28 L80 12 L100 24 L120 8 L140 20 L160 4 L180 16 L200 0 L220 16 L240 4 L260 20 L280 8 L300 24 L320 12 L340 28 L360 18 L400 32Z" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/></svg>
  </div>

  <h1 class="section-title">录入知识点</h1>
  <p class="section-sub">单条录入 · 批量 AI 固化 · 实时查重</p>

  <!-- 一、录入表单 -->
  <div class="wing-card">
    <div class="wing-card__cap">
      <span class="wing-card__ico">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </span>
      <span class="wing-card__title">新建词条</span>
      <span class="wing-card__meta" id="entry-meta">支持单词 / 短语</span>
    </div>
    <div class="u-prose">
      <label class="field-label">单词或短语</label>
      <input class="input" id="content" placeholder="例如：abandon / keep ... off">
      <label class="field-label">备注（可选）</label>
      <input class="input" id="remark" placeholder="例如：重点考察被动语态">
      <div class="u-row-sm u-mt-md">
        <button class="btn btn-primary" id="btn-add">录入知识点</button>
        <button class="btn btn-secondary" id="btn-clear" type="button">清空</button>
      </div>
      <p class="state-line" id="add-msg"></p>
    </div>
  </div>

  <!-- 二、AI 固化 -->
  <div class="wing-card">
    <div class="wing-card__cap">
      <span class="wing-card__ico">
        <svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/><circle cx="12" cy="12" r="4"/></svg>
      </span>
      <span class="wing-card__title">AI 一键固化</span>
      <span class="wing-card__meta">分片并发 · 边生成边可见</span>
    </div>
    <p class="notice text-sm">
      点击后后台<strong>分片并发</strong>处理所有待固化知识点；下方会实时显示已生成的词条，不必等全部完成。
    </p>
    <div class="u-row-sm">
      <button class="btn btn-primary" id="btn-solidify">一键 AI 固化</button>
      <button class="btn btn-secondary" id="btn-export-batch" type="button">批量导出 Word</button>
    </div>
    <p class="state-line" id="op-msg"></p>
    <div id="job-panel" style="display:none;margin-top:12px">
      <p class="state-line" id="job-status"></p>
      <div style="height:8px;background:#e7e5e4;border-radius:999px;overflow:hidden">
        <div id="job-bar" style="height:100%;width:0;background:#a16207;transition:width .3s"></div>
      </div>
      <div id="job-done" style="margin-top:10px"></div>
      <div id="job-failed" class="state-line state-line--danger"></div>
      <button class="btn btn-secondary" id="btn-resume" style="display:none;margin-top:8px">继续未完成任务</button>
    </div>
  </div>

  <!-- 三、知识点列表 -->
  <div class="wing-card">
    <div class="wing-card__cap">
      <span class="wing-card__ico">
        <svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M3 4h3v16H3zM18 4h3v16h-3z"/></svg>
      </span>
      <span class="wing-card__title">语言包 · 知识点</span>
      <span class="wing-card__meta" id="kp-count">–</span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="#78716c" stroke-width="2" width="18" height="18"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="filter" placeholder="搜索知识点">
    </div>
    <div id="kp-list"></div>
  </div>

</div>

<script>
(function ()
{
  'use strict';

  let kps = [];
  let jobId = null;
  let pollTimer = null;
  let shownIds = new Set();

  const TERMINAL = ['done', 'partial', 'failed', 'interrupted'];

  function setMsg(id, cls, t)
  {
    const e = document.getElementById(id);
    if (!e) return;
    e.className = 'state-line' + (cls ? ' ' + cls : '');
    e.textContent = t || '';
  }

  async function load()
  {
    try
    {
      const r = await fetch('/api/kp?size=1000', { cache: 'no-store' });
      const j = await r.json();
      kps = j.data || [];
    }
    catch (e) { kps = []; }
    document.getElementById('kp-count').textContent = '共 ' + kps.length + ' 条';
    render();
  }

  function render()
  {
    const q = (document.getElementById('filter').value || '').toLowerCase();
    const list = kps.filter(k =>
      (k.standard_content || k.user_input_content || '').toLowerCase().includes(q));
    const el = document.getElementById('kp-list');
    if (!list.length) { el.innerHTML = '<p class="state-line">暂无匹配知识点。</p>'; return; }

    el.innerHTML = list.map(k =>
    {
      const solid = k.is_solidified === 1;
      const word = k.standard_content || k.user_input_content;
      const detailUrl = '/pages/kp-detail.html?id=' + k.id;
      return `
      <div class="pack">
        <div class="pack__head">
          <a class="pack__title" href="${detailUrl}">${word}</a>
          <button class="pack__icon-btn" title="查看详情" data-act="detail" data-id="${k.id}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          </button>
          <button class="pack__icon-btn" title="单个固化" data-act="solidify" data-id="${k.id}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v3m0 12v3M3 12h3m12 0h3"/><circle cx="12" cy="12" r="4"/></svg>
          </button>
          <button class="pack__icon-btn" title="导出 Word" data-act="export" data-id="${k.id}">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
          </button>
        </div>
        <div class="pack__badges">
          <span class="pill pill--ai">${solid ? '已固化' : '待固化'}</span>
          ${solid
            ? `<span class="pill pill--ai">AI · ${k.master_require || ''}</span><span class="pill">难度 ${k.difficulty || '-'}</span>`
            : `<span class="pill">未 AI 固化</span>`}
        </div>
      </div>`;
    }).join('');
  }

  function attachHandlers()
  {
    document.getElementById('btn-add').addEventListener('click', addKp);
    document.getElementById('btn-clear').addEventListener('click', () =>
    {
      document.getElementById('content').value = '';
      document.getElementById('remark').value = '';
      document.getElementById('content').focus();
    });
    document.getElementById('btn-solidify').addEventListener('click', solidifyAll);
    document.getElementById('btn-resume').addEventListener('click', resumeJob);
    document.getElementById('btn-export-batch').addEventListener('click', exportBatch);
    document.getElementById('filter').addEventListener('input', render);

    document.getElementById('kp-list').addEventListener('click', e =>
    {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      if (act === 'solidify') solidifyOne(id);
      else if (act === 'export') exportOne(id);
      else if (act === 'detail') location.assign('/pages/kp-detail.html?id=' + id);
    });
  }

  async function addKp()
  {
    const content = document.getElementById('content').value.trim();
    const remark = document.getElementById('remark').value.trim();
    if (!content) { setMsg('add-msg', 'state-line--danger', '请输入单词或短语'); return; }
    setMsg('add-msg', '', '录入中…');
    try
    {
      const r = await fetch('/api/kp', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_input_content: content, remark })
      });
      const j = await r.json();
      if (r.ok && (j.ok || j.id))
      {
        setMsg('add-msg', 'state-line--success', '录入成功（#' + (j.id || '') + '）');
        document.getElementById('content').value = '';
        document.getElementById('remark').value = '';
        load();
      }
      else
      {
        setMsg('add-msg', 'state-line--danger', j.error || '录入失败');
      }
    }
    catch (e) { setMsg('add-msg', 'state-line--danger', '网络异常'); }
  }

  function showJobPanel(show)
  {
    document.getElementById('job-panel').style.display = show ? '' : 'none';
  }

  function resetJobPanel()
  {
    shownIds = new Set();
    document.getElementById('job-status').textContent = '';
    document.getElementById('job-bar').style.width = '0';
    document.getElementById('job-done').textContent = '';
    document.getElementById('job-failed').textContent = '';
    document.getElementById('btn-resume').style.display = 'none';
  }

  function renderJob(j)
  {
    showJobPanel(true);
    const label = {
      pending: '排队中', running: '正在生成', done: '已完成',
      partial: '部分完成', failed: '失败', interrupted: '已中断'
    }[j.status] || j.status;
    document.getElementById('job-status').className = 'state-line';
    document.getElementById('job-status').textContent =
      `${label}：完成 ${j.done}/${j.total}，失败 ${j.failed}（${j.progress}%）`;
    document.getElementById('job-bar').style.width = Math.max(0, Math.min(100, j.progress || 0)) + '%';

    const box = document.getElementById('job-done');
    (j.completed_ids || []).forEach(id =>
    {
      if (shownIds.has(id)) return;
      shownIds.add(id);
      const kp = kps.find(k => Number(k.id) === Number(id));
      const row = document.createElement('div');
      const a = document.createElement('a');
      a.href = '/pages/kp-detail.html?id=' + id;
      a.textContent = '✓ ' + (kp ? (kp.standard_content || kp.user_input_content) : ('#' + id));
      a.style.marginRight = '10px';
      row.appendChild(a);
      box.appendChild(row);
    });

    const failed = document.getElementById('job-failed');
    failed.textContent = (j.failed_items || [])
      .map(f => `${f.input || ('#' + f.knowledge_id)}：${f.error}`).join('；');

    const canResume = ['interrupted', 'partial', 'failed'].includes(j.status);
    document.getElementById('btn-resume').style.display = canResume ? '' : 'none';
  }

  function stopPolling()
  {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  function startPolling(id)
  {
    stopPolling();
    jobId = id;
    async function tick()
    {
      try
      {
        const r = await fetch('/api/kp/solidify/jobs/' + encodeURIComponent(id), { cache: 'no-store' });
        if (r.status === 404)
        {
          stopPolling();
          setMsg('op-msg', 'state-line--danger', '任务记录已失效；已生成的词条仍可查看。');
          load();
          return;
        }
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
        renderJob(j);
        if (TERMINAL.includes(j.status))
        {
          stopPolling();
          if (j.status === 'done') setMsg('op-msg', 'state-line--success', `固化完成：${j.done}/${j.total}`);
          else setMsg('op-msg', 'state-line--danger', `固化结束（${j.status}）：成功 ${j.done}，失败 ${j.failed}`);
          load();
          return;
        }
        pollTimer = setTimeout(tick, 1500);
      }
      catch (e)
      {
        stopPolling();
        setMsg('op-msg', 'state-line--danger', '进度查询失败：' + e.message);
      }
    }
    tick();
  }

  async function restoreActiveJob()
  {
    try
    {
      const r = await fetch('/api/kp/solidify/jobs?limit=10', { cache: 'no-store' });
      if (!r.ok) return;
      const j = await r.json();
      const jobs = (j && j.data) || [];
      const active = jobs.find(x => x.status === 'running' || x.status === 'pending');
      const stopped = jobs.find(x => ['interrupted', 'partial', 'failed'].includes(x.status));
      const target = active || stopped;
      if (!target) return;
      resetJobPanel();
      jobId = target.job_id;
      renderJob(target);
      if (active) startPolling(active.job_id);
      else setMsg('op-msg', '', '存在未完成任务，可点击“继续未完成任务”。');
    }
    catch (e) {}
  }

  async function resumeJob()
  {
    if (!jobId) return;
    const btn = document.getElementById('btn-resume');
    btn.disabled = true;
    try
    {
      const r = await fetch('/api/kp/solidify/jobs/' + encodeURIComponent(jobId) + '/resume', { method: 'POST' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      setMsg('op-msg', '', '已继续未完成任务…');
      startPolling(jobId);
    }
    catch (e)
    {
      setMsg('op-msg', 'state-line--danger', '继续失败：' + e.message);
    }
    btn.disabled = false;
  }

  async function solidifyAll()
  {
    const btn = document.getElementById('btn-solidify');
    btn.disabled = true;
    setMsg('op-msg', '', '正在提交批量固化任务…');
    try
    {
      const r = await fetch('/api/kp/solidify/async', { method: 'POST' });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      if (!j.total)
      {
        setMsg('op-msg', 'state-line--success', '没有待固化的知识点。');
        load();
        return;
      }
      resetJobPanel();
      showJobPanel(true);
      setMsg('op-msg', '', j.reused ? '已有运行中的任务，正在显示其进度。' : '任务已提交，后台生成中…');
      startPolling(j.job_id);
      load();
    }
    catch (e) { setMsg('op-msg', 'state-line--danger', '提交失败：' + e.message); }
    btn.disabled = false;
  }

  async function solidifyOne(id)
  {
    setMsg('op-msg', '', '固化中…');
    try
    {
      const r = await fetch('/api/kp/' + id + '/solidify', { method: 'POST' });
      const j = await r.json();
      if (r.ok && j.ok)
      {
        const eff = Number(j.id);
        if (eff && eff !== Number(id))
          setMsg('op-msg', 'state-line--success', '固化成功，已合并到已有词条 #' + eff);
        else
          setMsg('op-msg', 'state-line--success', '固化成功');
        load();
      }
      else
      {
        setMsg('op-msg', 'state-line--danger', j.error || '固化失败');
      }
    }
    catch (e) { setMsg('op-msg', 'state-line--danger', '网络异常'); }
  }

  function download(path)
  {
    window.open('/api/word/download?path=' + encodeURIComponent(path), '_blank');
  }

  async function exportOne(id)
  {
    setMsg('op-msg', '', '生成 Word 中…');
    try
    {
      const r = await fetch('/api/kp/' + id + '/export-word', { method: 'POST' });
      const j = await r.json();
      if (j.word_path)
      {
        setMsg('op-msg', 'state-line--success', '已生成，开始下载');
        download(j.word_path);
      }
      else
      {
        setMsg('op-msg', 'state-line--danger', j.error || '生成失败');
      }
    }
    catch (e) { setMsg('op-msg', 'state-line--danger', '网络异常'); }
  }

  async function exportBatch()
  {
    setMsg('op-msg', '', '批量生成合并 Word 中…');
    try
    {
      const r = await fetch('/api/kp/export-batch-word', { method: 'POST' });
      const j = await r.json();
      if (j.word_path)
      {
        setMsg('op-msg', 'state-line--success',
          `已合并 ${j.count} 个知识点，开始下载`);
        download(j.word_path);
      }
      else
      {
        setMsg('op-msg', 'state-line--danger', j.error || '生成失败');
      }
    }
    catch (e) { setMsg('op-msg', 'state-line--danger', '网络异常'); }
  }

  attachHandlers();
  load().then(restoreActiveJob);
})();
</script>
</body>
</html>
