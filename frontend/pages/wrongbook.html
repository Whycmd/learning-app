<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>错题本 · 学习圣殿</title>
<link rel="stylesheet" href="/static/fonts.css">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/components.css?v=20261121">
<script src="/static/theme.js"></script>
<script src="/static/nav.js"></script>
</head>
<body>
<div id="topbar-slot"></div>

<div class="page">
  <div class="dougong-bar">
    <svg viewBox="0 0 400 32"><path d="M0 32 L40 18 L60 28 L80 12 L100 24 L120 8 L140 20 L160 4 L180 16 L200 0 L220 16 L240 4 L260 20 L280 8 L300 24 L320 12 L340 28 L360 18 L400 32Z" fill="none" stroke="currentColor" stroke-width="1" opacity=".35"/></svg>
  </div>

  <h1 class="section-title">错题本</h1>
  <p class="section-sub">按错因归因 · 完成一次重练 +5 金桂（每日 10 次封顶）</p>

  <section class="wing-card">
    <div class="wb-summary">
      <span class="wb-summary__text" id="wb-summary">加载中…</span>
      <div class="u-row-sm">
        <a class="btn btn-primary" id="wb-start" href="/pages/review.html?retry=1">开始重练</a>
        <button class="btn btn-secondary" id="btn-archived" type="button" aria-pressed="false">归档视图</button>
        <button class="btn btn-secondary" id="btn-export" type="button">加入「错题导出」</button>
      </div>
    </div>
    <p class="state-line" id="wb-msg"></p>
  </section>

  <section class="wing-card">
    <div class="wing-card__cap">
      <span class="wing-card__ico">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M7 6v12h10V6"/><path d="M3 6h18"/></svg>
      </span>
      <span class="wing-card__title">筛选</span>
      <span class="wing-card__meta">错因 / 来源 / 时间</span>
    </div>
    <div class="wb-filter u-mt-md">
      <label>
        <span class="field-label">错因</span>
        <select class="input" id="wb-type">
          <option value="">全部</option>
          <option value="spelling">拼写</option>
          <option value="meaning">词义</option>
          <option value="collocation">搭配</option>
          <option value="grammar">语法</option>
          <option value="unknown">待判定</option>
        </select>
      </label>
      <label>
        <span class="field-label">来源</span>
        <select class="input" id="wb-source">
          <option value="">全部</option>
          <option value="exercise">练习</option>
          <option value="quiz">每日小测</option>
          <option value="retry">重练</option>
        </select>
      </label>
      <label>
        <span class="field-label">时间</span>
        <select class="input" id="wb-days">
          <option value="">全部</option>
          <option value="7">近 7 天</option>
          <option value="30">近 30 天</option>
          <option value="90">近 90 天</option>
        </select>
      </label>
      <label>
        <span class="field-label">关键词</span>
        <input class="input" id="wb-keyword" placeholder="单词或释义">
      </label>
      <button class="btn btn-primary" id="btn-refresh" type="button">刷新</button>
    </div>
    <p class="state-line" id="wb-filter-msg"></p>
  </section>

  <section class="wing-card">
    <div class="wing-card__cap">
      <span class="wing-card__ico">
        <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
      </span>
      <span class="wing-card__title">错题列表</span>
      <span class="wing-card__meta" id="wb-count">–</span>
    </div>
    <div id="wb-list"><p class="state-line">加载中…</p></div>
  </section>

  <details class="wing-card wb-collapse" id="wb-retry-wrap">
    <summary class="wing-card__cap">
      <span class="wing-card__ico">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
      </span>
      <span class="wing-card__title">重练队列</span>
      <span class="wing-card__meta" id="wb-retry-count">–</span>
    </summary>
    <div id="wb-retry"><p class="state-line">加载中…</p></div>
  </details>
</div>

<script src="/static/wrongbook.js"></script>
</body>
</html>
